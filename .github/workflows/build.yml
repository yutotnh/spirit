# サポートしている各種マイコンボードのビルドを行う
#
# ビルドツールは以下の2つで、各種マイコンボードでビルドが通ることを確認する
# - Mbed CE (CMake + Ninja。 Mbed OS のコミュニティ版。 Arm の Mbed OS は2026年7月に保守が終了した)
# - Arduino CLI (arduino-cli)
#
name: Build spirit

on:
  push:
    paths:
      - "**/CMakeLists.txt"
      - "**.h"
      - "**.cpp"
      - "**/build.yml"
      - "!tests/**"
  workflow_dispatch:

jobs:
  build-mbed-ce:
    container:
      # Mbed CE の公式のビルド環境 (Arm の GNU toolchain と CMake、 Ninja などが入っている)
      image: ghcr.io/mbed-ce/mbed-ce-env:main

    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [NUCLEO_F303K8, LPC1768]
        # Mbed OS 6 のプロファイル (release, debug, develop) に対応するビルドタイプ
        build_type: [Release, Debug, Develop]

    steps:
      - uses: actions/checkout@v4
        with:
          path: spirit

      - name: create-project
        run: |
          # Mbed CE を取得して、アプリケーションのプロジェクトを作る
          # (Mbed CE は、必要になったサブモジュールを、ビルド時に自動で取得する)
          git clone --depth 1 https://github.com/mbed-ce/mbed-os.git mbed-os
          cp spirit/.github/workflows/build-mbed/main.cpp .
          cp spirit/.github/workflows/build-mbed/CMakeLists.txt .
          cp spirit/.github/workflows/build-mbed/mbed_app.json5 .

      - name: build-mbed-ce
        run: |
          mkdir build && cd build
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMBED_TARGET=${{ matrix.target }}
          ninja

  build-arduino-cli:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        fqbn:
          [
            "esp32:esp32:esp32",
            "STMicroelectronics:stm32:GenF3",
            "STMicroelectronics:stm32:GenL0",
            "arduino:mbed:pico",
            "arduino:mbed:envie_m7",
            "arduino:mbed:nano33ble",
          ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install platform
        run: |
          arduino-cli config init

      - name: Install ESP32 package
        if: matrix.fqbn == 'esp32:esp32:esp32'
        run: |
          arduino-cli config add board_manager.additional_urls https://dl.espressif.com/dl/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install STM32 package
        if: startsWith(matrix.fqbn, 'STMicroelectronics:stm32')
        run: |
          arduino-cli config add board_manager.additional_urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32

      - name: Install Mbed package
        if: startsWith(matrix.fqbn, 'arduino:mbed')
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn ${{ matrix.fqbn }} --library . --verbose .github/workflows/build-arduino-cli
